services:
  - type: web
    name: privacy-detect
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      playwright install chromium --with-deps &&
      python seed.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: privacy-consent-db
          property: connectionString
      - key: HEADLESS
        value: "true"
      - key: SCRAPE_TIMEOUT
        value: "30000"
      # 아래 계정 정보는 Render 대시보드 > Environment 에서 직접 입력
      # - key: HMC_MAIN_EMAIL
      # - key: HMC_MAIN_PASSWORD
      # - key: HMC_SHOP_EMAIL
      # ... 등

databases:
  - name: privacy-consent-db
    plan: free
    databaseName: privacy_consent
