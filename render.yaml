services:
  - type: web
    name: privacy-detect
    runtime: python
    rootDir: backend
    pythonVersion: "3.11.9"
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: privacy-consent-db
          property: connectionString
      - key: HEADLESS
        value: "true"
      - key: SCRAPE_TIMEOUT
        value: "30000"

databases:
  - name: privacy-consent-db
    plan: free
    databaseName: privacy_consent
